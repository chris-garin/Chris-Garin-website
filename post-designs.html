<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#FF5130">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog post — layout options</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Open+Sans:wght@400;500;600;700&display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0F0F0F; color: #f4f2ec; font-family: "Open Sans", -apple-system, sans-serif; padding: 44px clamp(16px,4vw,56px) 120px; }
  .head { max-width: 760px; margin: 0 auto 10px; }
  .head h1 { font-family: "Lora", Georgia, serif; font-weight: 500; font-size: 2rem; margin: 0 0 6px; }
  .head p { color: #a9adb4; margin: 0; }
  .pd { max-width: 760px; margin: 0 auto; padding: 34px 0; }
  .pd__label { color: #83878d; font-size: 13px; letter-spacing: .04em; margin-bottom: 14px; }
  .pd__label b { color: #f4f2ec; font-weight: 600; font-size: 16px; margin-right: 8px; }

  /* The post "page" surface */
  .post { border-radius: 20px; overflow: hidden; background: #fff; color: #16181c; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  .post--dark { background: #121212; color: #e9e7e2; }

  .pbody { padding: 26px 40px 40px; }
  .pbody p { font-size: 1.02rem; line-height: 1.75; margin: 0 0 1.05em; color: #3b4250; }
  .post--dark .pbody p { color: #c3c6cc; }

  /* shared header atoms */
  .tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; padding: 5px 11px; border-radius: 999px; }
  .date { font-size: 13px; font-weight: 600; }
  .av { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; border: 3px solid #fff; flex-shrink: 0; }
  .by { display: flex; align-items: center; gap: 10px; font-size: 13.5px; font-weight: 600; }
  .ptitle { font-family: "Lora", Georgia, serif; font-weight: 500; letter-spacing: -.015em; line-height: 1.12; margin: 0; }
  .kicker { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #FF5130; margin: 0; }

  /* 1 Card Cover */
  .h1 .panel { position: relative; height: 150px; background: var(--tone); background-image: linear-gradient(150deg, rgba(255,255,255,.10), rgba(0,0,0,.16)); }
  .h1 .panel .tag { position: absolute; top: 16px; left: 20px; color: #fff; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.28); }
  .h1 .panel .date { position: absolute; top: 18px; right: 22px; color: rgba(255,255,255,.85); }
  .h1 .afterpanel { position: relative; padding: 0 40px; }
  .h1 .by { margin-top: -23px; margin-bottom: 16px; }
  .h1 .av { box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  .h1 .ptitle { font-size: 2rem; }

  /* 2 Panel, title below */
  .h2 { padding: 32px 40px 0; }
  .h2 .cover { height: 170px; border-radius: 16px; background: var(--tone); background-image: linear-gradient(150deg, rgba(255,255,255,.12), rgba(0,0,0,.18)); }
  .h2 .meta { margin-top: 22px; display: flex; align-items: center; gap: 12px; }
  .h2 .tag { color: #fff; background: var(--tone); }
  .h2 .date { color: #8a8f97; }
  .h2 .ptitle { margin-top: 14px; font-size: 2.1rem; }
  .h2 .by { margin-top: 16px; color: #4b4f56; }

  /* 3 Ink masthead */
  .h3 { background: #0F0F0F; color: #f4f2ec; padding: 46px 40px 40px; }
  .h3 .tag { color: #FF7A5E; background: rgba(255,81,48,.12); border: 1px solid rgba(255,81,48,.30); }
  .h3 .ptitle { margin-top: 20px; font-size: 2.35rem; color: #f4f2ec; }
  .h3 .by { margin-top: 24px; color: #a9adb4; }
  .h3 .av { border-color: #0F0F0F; }
  .h3 .date { color: #83878d; }

  /* 4 Title on cover */
  .h4 { position: relative; height: 350px; }
  .h4 .panel { position: absolute; inset: 0; background: var(--tone); background-image: linear-gradient(150deg, rgba(255,255,255,.10), rgba(0,0,0,.10)); }
  .h4 .panel::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,.02), rgba(0,0,0,.58)); }
  .h4 .tag { position: absolute; top: 22px; left: 26px; z-index: 2; color: #fff; background: rgba(255,255,255,.20); border: 1px solid rgba(255,255,255,.30); }
  .h4 .date { position: absolute; top: 24px; right: 26px; z-index: 2; color: rgba(255,255,255,.92); }
  .h4 .content { position: absolute; left: 26px; right: 26px; bottom: 24px; z-index: 2; }
  .h4 .ptitle { font-size: 2.2rem; color: #fff; max-width: 22ch; }
  .h4 .by { margin-top: 16px; color: rgba(255,255,255,.92); }
  .h4 .av { border-color: rgba(255,255,255,.55); }

  /* 5 Minimal editorial */
  .h5 { padding: 46px 40px 0; }
  .h5 .ptitle { margin-top: 14px; font-size: 2.5rem; }
  .h5 .bar { height: 6px; width: 64px; border-radius: 999px; background: var(--tone); margin: 22px 0; }
  .h5 .by { color: #4b4f56; }
  .h5 .by .date { color: #9aa0a7; margin-left: auto; }

  /* 6 Split */
  .h6 { display: grid; grid-template-columns: 1.25fr 1fr; gap: 28px; padding: 40px; align-items: center; }
  .h6 .tag { color: #fff; background: var(--tone); }
  .h6 .ptitle { margin-top: 16px; font-size: 1.95rem; }
  .h6 .by { margin-top: 18px; color: #4b4f56; }
  .h6 .date { color: #9aa0a7; }
  .h6 .cover { height: 220px; border-radius: 16px; background: var(--tone); background-image: linear-gradient(150deg, rgba(255,255,255,.12), rgba(0,0,0,.18)); }

  /* 7 Centered band */
  .h7 { text-align: center; padding: 46px 40px 0; }
  .h7 .ptitle { margin-top: 14px; font-size: 2.35rem; }
  .h7 .by { justify-content: center; margin-top: 18px; color: #4b4f56; }
  .h7 .band { height: 160px; background: var(--tone); background-image: linear-gradient(150deg, rgba(255,255,255,.12), rgba(0,0,0,.18)); margin: 28px -40px 0; }

  /* 8 Framed (offset shadow, house-style) */
  .h8 { padding: 40px 40px 0; }
  .h8 .frame { position: relative; height: 185px; border-radius: 16px; background: var(--tone); background-image: linear-gradient(150deg, rgba(255,255,255,.12), rgba(0,0,0,.18)); box-shadow: 9px 9px 0 rgba(224,81,47,.18); }
  .h8 .frame .tag { position: absolute; top: 16px; left: 16px; color: #fff; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.30); }
  .h8 .ptitle { margin-top: 30px; font-size: 2.1rem; }
  .h8 .by { margin-top: 16px; color: #4b4f56; }
  .h8 .date { color: #9aa0a7; }

  /* 9 Full dark */
  .h9 { padding: 44px 40px 6px; }
  .h9 .cover { height: 150px; border-radius: 16px; background: var(--tone); background-image: linear-gradient(150deg, rgba(255,255,255,.10), rgba(0,0,0,.18)); margin-bottom: 26px; }
  .h9 .tag { color: #FF7A5E; background: rgba(255,81,48,.12); border: 1px solid rgba(255,81,48,.30); }
  .h9 .ptitle { margin-top: 16px; font-size: 2.2rem; color: #f4f2ec; }
  .h9 .by { margin-top: 20px; color: #a9adb4; }
  .h9 .av { border-color: #121212; }
  .h9 .date { color: #83878d; }

  /* 10 Soft tint */
  .h10 { margin: 30px 30px 0; border-radius: 18px; background: rgba(224,81,47,.08); padding: 32px 34px; }
  .h10 .tag { color: #C4442A; background: rgba(224,81,47,.14); border: 1px solid rgba(224,81,47,.30); }
  .h10 .ptitle { margin-top: 16px; font-size: 2.1rem; }
  .h10 .by { margin-top: 18px; color: #4b4f56; }
  .h10 .date { color: #a97e72; }

  @media (max-width: 620px) { .h6 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <div class="head">
    <h1>Blog post — layout options</h1>
    <p>Ten header/layout directions for an individual post, all pulling in the Field Notes design language. Same real essay in each. Pick a number.</p>
  </div>
  <div id="opts"></div>

<script>
const AV = '/images/chrisgarin2.png';
const TITLE = "How a Realtor&rsquo;s Postcards Beat His Email Funnel";
const BODY = `<div class="pbody">
  <p>A realtor I work with pulls 3x more replies from postcards than from his entire email automation setup.</p>
  <p>It&rsquo;s the lowest-tech thing he does, and it&rsquo;s his best-performing channel.</p>
  <p>What&rsquo;s crazy is, I have another realtor client who&rsquo;s never mailed a postcard in her life. Her whole thing is just being active on Facebook and Instagram.</p>
</div>`;
const by = (cls='') => `<div class="by ${cls}"><img class="av" src="${AV}" alt=""><span>by Chris Garin</span></div>`;

const D = [
  ["Card Cover", "the Field Notes card, scaled up to a hero", "light",
    `<div class="h1"><div class="panel"><span class="tag">Essay</span><span class="date">Aug 28, 2026</span></div>
     <div class="afterpanel">${by()}<h1 class="ptitle">${TITLE}</h1></div></div>`],
  ["Panel, Title Below", "rounded cover panel, then title + byline", "light",
    `<div class="h2"><div class="cover"></div><div class="meta"><span class="tag">Essay</span><span class="date">August 28, 2026</span></div>
     <h1 class="ptitle">${TITLE}</h1>${by()}</div>`],
  ["Ink Masthead", "dark hero band, light reading body", "light",
    `<div class="h3"><span class="tag">Essay</span><h1 class="ptitle">${TITLE}</h1>
     <div class="by"><img class="av" src="${AV}" alt=""><span>by Chris Garin</span><span class="date">&middot; August 28, 2026</span></div></div>`],
  ["Title on Cover", "magazine cover: title over the panel", "light",
    `<div class="h4"><div class="panel"></div><span class="tag">Essay</span><span class="date">Aug 28, 2026</span>
     <div class="content"><h1 class="ptitle">${TITLE}</h1>${by()}</div></div>`],
  ["Minimal Editorial", "no big panel, a slim colored bar for accent", "light",
    `<div class="h5"><p class="kicker">Essay</p><h1 class="ptitle">${TITLE}</h1><div class="bar"></div>
     <div class="by"><img class="av" src="${AV}" alt=""><span>by Chris Garin</span><span class="date">August 28, 2026</span></div></div>`],
  ["Split", "meta + title left, colored panel right", "light",
    `<div class="h6"><div class="left"><span class="tag">Essay</span><h1 class="ptitle">${TITLE}</h1>
     <div class="by"><img class="av" src="${AV}" alt=""><span>by Chris Garin</span> <span class="date">&middot; Aug 28, 2026</span></div></div>
     <div class="cover"></div></div>`],
  ["Centered + Band", "centered title, full-width colored divider", "light",
    `<div class="h7"><p class="kicker">Essay</p><h1 class="ptitle">${TITLE}</h1>
     <div class="by"><img class="av" src="${AV}" alt=""><span>by Chris Garin &middot; August 28, 2026</span></div><div class="band"></div></div>`],
  ["Framed (offset)", "house-style panel with an offset coral shadow", "light",
    `<div class="h8"><div class="frame"><span class="tag">Essay</span></div><h1 class="ptitle">${TITLE}</h1>
     <div class="by"><img class="av" src="${AV}" alt=""><span>by Chris Garin</span> <span class="date">&middot; Aug 28, 2026</span></div></div>`],
  ["Full Dark", "the whole page dark, like the menu", "dark",
    `<div class="h9"><div class="cover"></div><span class="tag">Essay</span><h1 class="ptitle">${TITLE}</h1>
     <div class="by"><img class="av" src="${AV}" alt=""><span>by Chris Garin</span> <span class="date">&middot; Aug 28, 2026</span></div></div>`],
  ["Soft Tint", "a subtle coral-tinted rounded hero box", "light",
    `<div class="h10"><span class="tag">Essay</span><h1 class="ptitle">${TITLE}</h1>
     <div class="by"><img class="av" src="${AV}" alt=""><span>by Chris Garin</span> <span class="date">&middot; Aug 28, 2026</span></div></div>`],
];

const el = document.getElementById('opts');
D.forEach((d,i)=>{
  const [name,desc,theme,header]=d;
  el.insertAdjacentHTML('beforeend', `<section class="pd">
    <div class="pd__label"><b>${i+1}. ${name}</b>${desc}</div>
    <div class="post ${theme==='dark'?'post--dark':''}" style="--tone:#E0512F">${header}${BODY}</div>
  </section>`);
});
</script>
</body>
</html>
